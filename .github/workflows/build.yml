name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libffi-dev libssl-dev

      - name: Install Buildozer, Cython, and tools
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer python-for-android

      - name: Accept Android SDK Licenses
        run: |
          # Automatically accept licenses for any SDK tools downloaded by buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # This command answers 'y' to all license agreements automatically
          export PATH=$PATH:~/.buildozer/android/platform/android-sdk/tools/bin/
          yes | buildozer android clean || true

      - name: Run Buildozer
        run: |
          # Use 'yes' to pipe confirmation if any license prompts pop up during build initialization
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
